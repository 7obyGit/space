name: Release

on:
    push:
        branches: [main]

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        # Avoid running on release commits created by semantic-release itself
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - uses: actions/checkout@v4
              with:
                  # Use persist-credentials: false to allow semantic-release to push with its own token
                  persist-credentials: false
                  fetch-depth: 0 # Fetches all history for all branches and tags

            - name: Sync and prune Git tags
              run: |
                  git fetch --prune --prune-tags origin
                  git tag -l

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
                  cache: "npm"
                  registry-url: "https://registry.npmjs.org"

            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

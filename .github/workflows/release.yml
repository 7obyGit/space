name: Release

on:
    push:
        branches: [main]

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        # Avoid running on release commits created by semantic-release itself
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - uses: actions/checkout@v4
              with:
                  # Use persist-credentials: false to allow semantic-release to push with its own token
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run build

            - name: Release
              run: npx semantic-release
